services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - STORE_INTEL_ENV=production
      - POS_CSV_PATH=data/pos_transactions.csv
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
